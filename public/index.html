<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>C:/</title>
        <meta name="description" content="rafael" />
        <meta name="color-scheme" content="light" />
        <meta name="theme-color" content="#9a9a9a" />

        <link rel="preconnect" href="https://unpkg.com" crossorigin />
        <link
            rel="preconnect"
            href="https://upload.wikimedia.org"
            crossorigin
        />
        <link rel="preconnect" href="https://cdn.discordapp.com" crossorigin />
        <link rel="stylesheet" href="https://unpkg.com/7.css" />
        <link rel="stylesheet" href="styles.css" />
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <script
            src="https://unpkg.com/colorthief@2.4.0/dist/color-thief.umd.js"
            defer
        ></script>
    </head>
    <body>
        <main
            id="conteudo"
            class="window active card-window"
            aria-label="Cartão de perfil de Rafael"
        >
            <div class="title-bar">
                <div class="title-bar-text">Rafael</div>
                <div class="title-bar-controls" aria-hidden="true">
                    <button
                        class="is-help"
                        aria-label="Help"
                        tabindex="-1"
                        onclick="window.open('https://github.com/sittiev/ppp', '_blank')"
                    ></button>
                    <button
                        class="is-minimize"
                        aria-label="Minimizar"
                        tabindex="-1"
                    ></button>
                    <button
                        class="is-maximize"
                        aria-label="Maximizar"
                        tabindex="-1"
                    ></button>
                    <button
                        class="is-close"
                        aria-label="Fechar"
                        tabindex="-1"
                    ></button>
                </div>
            </div>

            <div class="window-body has-space">
                <fieldset class="avatar-box">
                    <legend>Avatar</legend>
                    <div class="avatar-wrap">
                        <div class="avatar-frame">
                            <img
                                id="discord-avatar"
                                alt="Avatar"
                                loading="lazy"
                                decoding="async"
                            />
                            <img
                                class="avatar-overlay"
                                src="assets/images/frame.webp"
                                alt=""
                                aria-hidden="true"
                            />
                        </div>
                        <p
                            class="visitors is-top is-right"
                            id="visitors"
                            role="tooltip"
                            hx-get="/api/visitors"
                            hx-trigger="load, every 10s"
                            hx-swap="innerHTML"
                        >
                            visitantes…
                        </p>
                    </div>
                </fieldset>

                <nav aria-label="Redes e projetos">
                    <ul class="link-list">
                        <li>
                            <a
                                role="button"
                                href="https://instagram.com/sxraphael"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                Instagram
                                <span class="visually-hidden"
                                    >(abre em nova aba)</span
                                >
                            </a>
                        </li>
                        <li>
                            <a
                                role="button"
                                href="https://github.com/sittiev"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                GitHub
                                <span class="visually-hidden"
                                    >(abre em nova aba)</span
                                >
                            </a>
                        </li>
                    </ul>
                </nav>

                <fieldset class="photo-box">
                    <legend>Rio de Janeiro</legend>
                    <figure style="margin: 0">
                        <div class="photo-frame">
                            <div class="photo-banner" id="photo-banner"></div>
                        </div>
                        <figcaption class="credit">
                            Foto: Fonte não identificada
                        </figcaption>
                    </figure>
                </fieldset>

                <fieldset class="now-playing-box">
                    <legend>Tocando agora</legend>
                    <div
                        class="np-body"
                        id="np-body"
                        aria-live="polite"
                        hx-get="/api/now-playing"
                        hx-trigger="load, every 10s"
                        hx-swap="innerHTML"
                        hx-on:after-swap="updatePlayer(event)"
                    >
                        <p class="np-empty">carregando…</p>
                    </div>
                    <div class="np-progress-wrap" id="np-progress-wrap" hidden>
                        <div class="np-progress" id="np-progress-bar"></div>
                        <div class="np-times">
                            <span id="np-elapsed">0:00</span>
                            <span id="np-total">0:00</span>
                        </div>
                    </div>
                    <audio id="np-audio" preload="auto" hidden></audio>
                </fieldset>
            </div>

            <div class="status-bar">
                <p class="status-bar-field" id="clock"></p>
            </div>
        </main>

        <dialog
            id="update-dialog"
            class="window active"
            aria-labelledby="update-dialog-title"
        >
            <div class="title-bar">
                <div class="title-bar-text" id="update-dialog-title">
                    <img
                        class="update-title-icon"
                        src="assets/images/windows-shield.svg"
                        alt=""
                        aria-hidden="true"
                        width="16"
                        height="16"
                    />
                    Windows Update
                </div>
                <div class="title-bar-controls">
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body has-space update-body">
                <div class="update-banner">
                    <img
                        class="update-shield"
                        src="assets/images/windows-shield.svg"
                        alt=""
                        aria-hidden="true"
                        width="32"
                        height="32"
                    />
                    <p class="update-headline">
                        Recarregue a página para concluir a instalação das
                        atualizações importantes
                    </p>
                </div>
                <p class="update-text">
                    A página será recarregada automaticamente em
                    <span id="update-countdown">12</span>&nbsp;s.
                </p>
            </div>
            <footer class="update-actions">
                <button id="update-reload" class="default">
                    Recarregar agora
                </button>
            </footer>
        </dialog>

        <script src="assets/player.js?v=__V__" defer></script>
        <script src="assets/avatar.js?v=__V__" defer></script>
        <script src="assets/app.js?v=__V__" defer></script>
    </body>
</html>
